<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Ovládanie svetla</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 3em auto; padding: 1em; text-align: center; }
        h1 { color: #333; }
        button {
            font-size: 1.5em; padding: 1em 2em; border: 0; border-radius: 8px;
            background: #16a34a; color: white; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        button:hover { background: #15803d; }
        .stav-on { color: #16a34a; font-weight: bold; }
        .stav-off { color: #6b7280; }
        .indikator {
            display: inline-block; width: 100px; height: 100px; border-radius: 50%;
            margin: 1em 0; transition: background 0.3s;
        }
        .indikator.on { background: radial-gradient(#fef3c7, #fbbf24, #d97706); box-shadow: 0 0 40px #fbbf24; }
        .indikator.off { background: #d1d5db; }
    </style>
</head>
<body>
    <h1>Ovládanie svetla na ESP32</h1>
    <div id="indikator" class="indikator off"></div>
    <p>Aktuálny stav: <span id="stav" class="stav-off">načítavam...</span></p>
    <button id="btn">Prepnúť svetlo</button>

    <script>
        const btn = document.getElementById("btn");
        const stavEl = document.getElementById("stav");
        const indikator = document.getElementById("indikator");

        function zobraz(stav) {
            if (stav) {
                stavEl.textContent = "ZAPNUTÉ";
                stavEl.className = "stav-on";
                indikator.className = "indikator on";
            } else {
                stavEl.textContent = "VYPNUTÉ";
                stavEl.className = "stav-off";
                indikator.className = "indikator off";
            }
        }

        async function aktualizuj() {
            try {
                const r = await fetch("/api/svetlo");
                const d = await r.json();
                zobraz(d.led);
            } catch (e) {
                stavEl.textContent = "chyba spojenia";
            }
        }

        btn.onclick = async () => {
            const r = await fetch("/api/svetlo/prepni", { method: "POST" });
            const d = await r.json();
            zobraz(d.led);
        };

        aktualizuj();
        setInterval(aktualizuj, 2000);
    </script>
</body>
</html>
